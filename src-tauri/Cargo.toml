[package]
name = "agent-harness"
version = "0.0.0"
description = "Phase 0A inert repository and runtime scaffold"
authors = ["Agent Harness Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agent_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.10.3", features = [] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }

[dev-dependencies]
toml = "1.1.2"
